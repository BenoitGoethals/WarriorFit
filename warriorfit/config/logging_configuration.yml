version: 1
disable_existing_loggers: False

formatters:
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: default
    filename: logs/application.log
    mode: a

  broker_file:
    class: logging.FileHandler
    level: INFO
    formatter: default
    filename: logs/broker.log
    mode: a

loggers:
  # Message broker / HR-outbox logs (warriorfit.mom.broker) go to their own
  # file. propagate: false keeps them out of logs/application.log.
  warriorfit.mom:
    level: INFO
    handlers: [console, broker_file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
