# This workflow will install Python dependencies, run tests and lint with a single version of Python
# Using UV for faster dependency management
name: Python application

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Set up Python 3.13
      run: uv python install 3.13
      
    - name: Create virtual environment
      run: uv venv
      
    - name: Install dependencies
      run: |
        uv pip install flake8 pytest black isort mypy bandit pip-audit
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
    
    - name: Format check with Black
      run: |
        uv run black --check --diff .
      continue-on-error: true
    
    - name: Import sorting check with isort
      run: |
        uv run isort --check-only --diff .
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,.git,__pycache__,build,dist
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,.git,__pycache__,build,dist
    
    - name: Type check with mypy
      run: |
        uv run mypy . --ignore-missing-imports --exclude='.venv|build|dist'
      continue-on-error: true
    
    - name: Security check with bandit
      run: |
        uv run bandit -r . -f screen --exclude ./.venv
      continue-on-error: true
    
    - name: Check for vulnerable dependencies
      run: |
        uv run pip-audit --require-hashes --disable-pip
      continue-on-error: true
    
    - name: Test with pytest
      run: uv run pytest
