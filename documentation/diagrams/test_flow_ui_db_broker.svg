<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1060" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a3a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4f8a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="740" y="36" text-anchor="middle" font-size="22" font-weight="bold">WarriorFit — Test result flow: UI → Service → DB → Broker → HR</text>
  <text x="740" y="58" text-anchor="middle" font-size="13" fill="#555">async, single event-loop. Broker has an in-memory queue + persistent outbox table (hr_messages)</text>

  <!-- ================= Top: synchronous user-facing path ================= -->
  <g>
    <!-- UI -->
    <rect x="40" y="100" width="220" height="120" rx="10" fill="#e8f0fe" stroke="#1f4f8a" stroke-width="2"/>
    <text x="150" y="125" text-anchor="middle" font-weight="bold" fill="#1f4f8a">UI page (Shiny)</text>
    <text x="150" y="148" text-anchor="middle">phef.py / combat_test.py /</text>
    <text x="150" y="166" text-anchor="middle">swim_test.py / functional_test.py /</text>
    <text x="150" y="184" text-anchor="middle">march.py</text>
    <text x="150" y="208" text-anchor="middle" font-style="italic" fill="#555">click "Add"</text>

    <!-- Controller -->
    <rect x="320" y="100" width="220" height="120" rx="10" fill="#e8f0fe" stroke="#1f4f8a" stroke-width="2"/>
    <text x="430" y="125" text-anchor="middle" font-weight="bold" fill="#1f4f8a">Controller</text>
    <text x="430" y="148" text-anchor="middle">phef_controller.py</text>
    <text x="430" y="166" text-anchor="middle">combat / swim / functional /</text>
    <text x="430" y="184" text-anchor="middle">march_controller.py</text>
    <text x="430" y="208" text-anchor="middle" font-style="italic" fill="#555">build domain object</text>

    <!-- Service -->
    <rect x="600" y="100" width="240" height="120" rx="10" fill="#fdf5e6" stroke="#b8860b" stroke-width="2"/>
    <text x="720" y="125" text-anchor="middle" font-weight="bold" fill="#b8860b">Service</text>
    <text x="720" y="148" text-anchor="middle">ServiceTest.add_test_to_session</text>
    <text x="720" y="166" text-anchor="middle">ServiceMarch.add_march</text>
    <text x="720" y="190" text-anchor="middle" font-style="italic" fill="#555">1) repo.add(test) → DB</text>
    <text x="720" y="206" text-anchor="middle" font-style="italic" fill="#555">2) broker.send_message(test)</text>

    <!-- Repository / DB -->
    <rect x="900" y="100" width="240" height="120" rx="10" fill="#eafbe7" stroke="#1f8a3a" stroke-width="2"/>
    <text x="1020" y="125" text-anchor="middle" font-weight="bold" fill="#1f8a3a">Repository → PostgreSQL</text>
    <text x="1020" y="148" text-anchor="middle">FitnessTestRepository / MarchRepo</text>
    <text x="1020" y="170" text-anchor="middle">tables: phef_tests, combat_tests,</text>
    <text x="1020" y="186" text-anchor="middle">combat_swimming_tests,</text>
    <text x="1020" y="202" text-anchor="middle">functional_tests, marches</text>

    <!-- Audit + Mail -->
    <rect x="1200" y="100" width="240" height="120" rx="10" fill="#f3e8fe" stroke="#5b3b8a" stroke-width="2"/>
    <text x="1320" y="125" text-anchor="middle" font-weight="bold" fill="#5b3b8a">Side effects</text>
    <text x="1320" y="148" text-anchor="middle">audit_logs (Service.add_audit_log)</text>
    <text x="1320" y="170" text-anchor="middle">NotifyMail.send_mail (PHEF/COMBAT/</text>
    <text x="1320" y="186" text-anchor="middle">SWIM/FUNCTIONAL only)</text>
    <text x="1320" y="206" text-anchor="middle" font-style="italic" fill="#555">awaited, but failure ≠ rollback</text>

    <!-- Arrows -->
    <line x1="260" y1="160" x2="320" y2="160" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="540" y1="160" x2="600" y2="160" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="840" y1="140" x2="900" y2="140" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="870" y="132" font-size="11" fill="#222">add_test()</text>
    <line x1="1140" y1="180" x2="1200" y2="180" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= Bridge: send_message arrow down ================= -->
  <g>
    <line x1="720" y1="220" x2="720" y2="280" stroke="#1f4f8a" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="730" y="252" font-size="12" fill="#1f4f8a" font-weight="bold">await broker.send_message(test)</text>
    <text x="730" y="270" font-size="11" fill="#555">non-blocking — UI returns immediately</text>
  </g>

  <!-- ================= Middle: Broker box ================= -->
  <g>
    <rect x="200" y="290" width="1080" height="270" rx="14" fill="#fffaf0" stroke="#b8860b" stroke-width="2.5"/>
    <text x="740" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#b8860b">Broker (warriorfit/mom/broker.py — singleton, started by app.py)</text>

    <!-- send_message lane -->
    <rect x="230" y="335" width="320" height="200" rx="10" fill="#fff5e8" stroke="#b8860b" stroke-width="1.5"/>
    <text x="390" y="358" text-anchor="middle" font-weight="bold">send_message(test)</text>
    <text x="245" y="380" font-size="12">• Pick DTO by isinstance:</text>
    <text x="260" y="396" font-size="12">  Phef / Combat / Swim / March / Functional</text>
    <text x="245" y="414" font-size="12">• HrMessage(json.dumps(dto), datetime.now())</text>
    <text x="245" y="432" font-size="12">• <tspan font-family="monospace">_msg_queue.put(hr_m)</tspan></text>
    <text x="245" y="455" font-size="12" fill="#555" font-style="italic">in-process asyncio.Queue</text>
    <text x="245" y="473" font-size="12" fill="#555" font-style="italic">(NOT yet persisted)</text>
    <text x="245" y="500" font-size="12" fill="#c0392b">⚠ if app crashes here, queued msg is lost</text>
    <text x="245" y="518" font-size="12" fill="#c0392b">— this is the only window where data is at risk</text>

    <!-- worker loop lane -->
    <rect x="580" y="335" width="320" height="200" rx="10" fill="#fff5e8" stroke="#b8860b" stroke-width="1.5"/>
    <text x="740" y="358" text-anchor="middle" font-weight="bold">worker() — every poll_interval_s (default 5 s)</text>
    <text x="595" y="380" font-size="12" font-weight="bold">_process_cycle():</text>
    <text x="595" y="398" font-size="12">1) Drain in-memory queue:</text>
    <text x="610" y="414" font-size="12">while not queue.empty():</text>
    <text x="610" y="430" font-size="12"><tspan font-family="monospace">repo.add_hr_message(msg)</tspan> → DB</text>
    <text x="595" y="452" font-size="12">2) check_and_send_messages():</text>
    <text x="610" y="468" font-size="12">batch = repo.get_due_pending_</text>
    <text x="610" y="484" font-size="12">messages(limit=batch_size)</text>
    <text x="610" y="500" font-size="12">for msg in batch → send → delete</text>
    <text x="610" y="516" font-size="12">on fail → mark_failure (back-off / DLQ)</text>

    <!-- HTTP lane -->
    <rect x="930" y="335" width="320" height="200" rx="10" fill="#fff5e8" stroke="#b8860b" stroke-width="1.5"/>
    <text x="1090" y="358" text-anchor="middle" font-weight="bold">_send_message_to_hr(msg)</text>
    <text x="945" y="380" font-size="12"><tspan font-family="monospace">BEMILService.sent_hr_message_to_hr</tspan></text>
    <text x="945" y="398" font-size="12">POST → ApplicationConfig.hr_url</text>
    <text x="945" y="416" font-size="12">(OAuth2 + client cert)</text>
    <text x="945" y="442" font-size="12" font-weight="bold">try / except per error class:</text>
    <text x="945" y="458" font-size="12">• TimeoutError → return None</text>
    <text x="945" y="474" font-size="12">• ConnectionError → return None</text>
    <text x="945" y="490" font-size="12">• OSError / IOError → return None</text>
    <text x="945" y="506" font-size="12">• ValueError / JSONDecodeError → None</text>
    <text x="945" y="522" font-size="12" fill="#1f8a3a">success → returns dict (delete row)</text>

    <!-- arrows inside broker box -->
    <line x1="550" y1="435" x2="580" y2="435" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="900" y1="435" x2="930" y2="435" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= Bottom: persistence & HR ================= -->
  <g>
    <!-- Outbox table -->
    <rect x="240" y="610" width="280" height="110" rx="10" fill="#eafbe7" stroke="#1f8a3a" stroke-width="2"/>
    <text x="380" y="635" text-anchor="middle" font-weight="bold" fill="#1f8a3a">DB table: hr_messages</text>
    <text x="380" y="656" text-anchor="middle" font-size="11">id, message (JSON), datetime_created,</text>
    <text x="380" y="672" text-anchor="middle" font-size="11">attempt_count, next_retry_at,</text>
    <text x="380" y="688" text-anchor="middle" font-size="11">dead_letter, last_error</text>
    <text x="380" y="710" text-anchor="middle" font-size="11" font-style="italic" fill="#555">durable outbox + retry state</text>

    <!-- HR system -->
    <rect x="960" y="610" width="280" height="110" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="1100" y="635" text-anchor="middle" font-weight="bold" fill="#c0392b">External HR system (BEMIL HRM)</text>
    <text x="1100" y="658" text-anchor="middle" font-size="12">https://api.bensoft.be/ (test) /</text>
    <text x="1100" y="676" text-anchor="middle" font-size="12">prod HRM endpoint</text>
    <text x="1100" y="700" text-anchor="middle" font-size="12" font-style="italic" fill="#555">may be offline / slow / 5xx</text>

    <!-- Drain to DB -->
    <line x1="390" y1="535" x2="390" y2="610" stroke="#1f8a3a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="400" y="575" font-size="12" fill="#1f8a3a">add_hr_message()</text>
    <text x="400" y="591" font-size="11" fill="#555">drain step (1)</text>

    <!-- Read for sending -->
    <line x1="520" y1="640" x2="930" y2="450" stroke="#1f4f8a" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="640" y="600" font-size="12" fill="#1f4f8a">get_due_pending_messages(limit=batch_size)</text>

    <!-- HTTP send -->
    <line x1="1090" y1="535" x2="1090" y2="610" stroke="#1f4f8a" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="1100" y="575" font-size="12" fill="#1f4f8a">HTTP POST</text>

    <!-- Success delete -->
    <line x1="960" y1="700" x2="520" y2="700" stroke="#1f8a3a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="700" y="694" font-size="12" fill="#1f8a3a">200 OK → delete_hr_message(id)</text>

    <!-- Failure: mark_failure with back-off / DLQ -->
    <line x1="1100" y1="720" x2="1100" y2="770" stroke="#c0392b" stroke-width="2"/>
    <line x1="1100" y1="770" x2="380" y2="770" stroke="#c0392b" stroke-width="2"/>
    <line x1="380" y1="770" x2="380" y2="720" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="740" y="754" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">HR offline / timeout / non-2xx → mark_failure(): attempt_count++, last_error, next_retry_at += back-off</text>
    <text x="740" y="770" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">attempt_count ≥ max_attempts → dead_letter = TRUE (broker stops retrying, row kept for ops triage)</text>
  </g>

  <!-- ================= Failure-mode legend (right side) ================= -->
  <g>
    <rect x="40" y="610" width="180" height="270" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
    <text x="130" y="635" text-anchor="middle" font-weight="bold">What happens when…</text>

    <text x="50" y="660" font-size="12" font-weight="bold" fill="#c0392b">HR server offline</text>
    <text x="50" y="676" font-size="11">• POST raises Connection/</text>
    <text x="50" y="690" font-size="11">  Timeout/OSError</text>
    <text x="50" y="704" font-size="11">• _send_message_to_hr → None</text>
    <text x="50" y="718" font-size="11">• row stays in hr_messages</text>
    <text x="50" y="732" font-size="11">• logged at WARNING; retried</text>
    <text x="50" y="746" font-size="11">  every 5 s</text>

    <text x="50" y="772" font-size="12" font-weight="bold" fill="#b8860b">App restart</text>
    <text x="50" y="788" font-size="11">• in-memory queue lost</text>
    <text x="50" y="802" font-size="11">• rows already in DB outbox</text>
    <text x="50" y="816" font-size="11">  are picked up next cycle</text>

    <text x="50" y="842" font-size="12" font-weight="bold" fill="#1f4f8a">DB down</text>
    <text x="50" y="858" font-size="11">• repo.add raises OSError</text>
    <text x="50" y="872" font-size="11">• logged, message stays in</text>
    <text x="50" y="886" font-size="11">  in-memory queue</text>
  </g>

  <!-- ================= Bottom legend bar ================= -->
  <g transform="translate(40, 920)">
    <rect x="0" y="0" width="1400" height="120" rx="10" fill="#fbfbfb" stroke="#aaa"/>
    <text x="20" y="25" font-weight="bold">Key invariants</text>

    <text x="20" y="48" font-size="12">• User does <tspan font-weight="bold">not</tspan> wait for HR — UI returns as soon as the test row is committed and the HrMessage is enqueued.</text>
    <text x="20" y="66" font-size="12">• Outbox pattern: <tspan font-family="monospace">hr_messages</tspan> table is the source of truth for "must still send"; in-memory queue is a fast-path only.</text>
    <text x="20" y="84" font-size="12">• Worker loop is a single asyncio task on the main loop, polling every <tspan font-weight="bold">poll_interval_s</tspan> (default 5 s); cancellation is graceful.</text>
    <text x="20" y="102" font-size="12">• Failures use <tspan font-weight="bold">exponential back-off</tspan> (base × 2^(n-1), capped) and a <tspan font-weight="bold">dead-letter</tspan> state after <tspan font-family="monospace">max_attempts</tspan>; oldest-first scheduling avoids head-of-line blocking.</text>
  </g>
</svg>
